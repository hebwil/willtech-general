name: Publish verified v3.0.0

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v3.0.0.yml']

permissions:
  actions: read
  contents: write

concurrency:
  group: willtech-release-v3.0.0
  cancel-in-progress: false

jobs:
  publish:
    name: build, verify and publish v3.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      PINNED_SHA: 83de0e07c13e3438e9adab5863b821c2382e0589
      RELEASE_TAG: v3.0.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 83de0e07c13e3438e9adab5863b821c2382e0589
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gate exact published commit and 5/5 CI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PINNED_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44161602314" > "$RUNNER_TEMP/ci.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44161602314/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          run=json.loads((root/'ci.json').read_text())
          jobs=json.loads((root/'jobs.json').read_text())['jobs']
          assert run['head_sha']==os.environ['PINNED_SHA']
          assert run['status']=='completed' and run['conclusion']=='success'
          assert len(jobs)==5, f"expected 5 jobs, got {len(jobs)}"
          assert all(j['status']=='completed' and j['conclusion']=='success' for j in jobs), [(j['name'],j['conclusion']) for j in jobs]
          print('CI verified: exact SHA, 5/5 jobs SUCCESS')
          PY
          # Resume ONLY the already-created draft for this exact release.
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)" = "$PINNED_SHA"
      - name: Test distribution built from exact validated commit
        shell: bash
        run: |
          set -euo pipefail
          python tools/test-dist.py
          python tools/build-dist.py HEAD
          python tools/verify-release.py dist "$RELEASE_TAG"
      - name: Download draft assets and prove installed distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-download"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-download"
          cmp dist/MANIFEST.json "$RUNNER_TEMP/release-download/MANIFEST.json"
          cmp dist/SHA256SUMS.txt "$RUNNER_TEMP/release-download/SHA256SUMS.txt"
          cmp dist/willtech-general-3.0.0.tar.gz "$RUNNER_TEMP/release-download/willtech-general-3.0.0.tar.gz"
          python tools/verify-release.py "$RUNNER_TEMP/release-download" "$RELEASE_TAG"
      - name: Publish stable release only after complete draft verification
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          test "$TAG_SHA" = "$PINNED_SHA"
          echo "Stable release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
      - name: Verify public downloadable archive checksum
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 180 \
            -o "$RUNNER_TEMP/public-archive.tar.gz" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/willtech-general-3.0.0.tar.gz"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          h=hashlib.sha256((Path(os.environ['RUNNER_TEMP'])/'public-archive.tar.gz').read_bytes()).hexdigest()
          m=json.loads(Path('dist/MANIFEST.json').read_text())
          assert h==m['archive_sha256'], (h,m['archive_sha256'])
          print('PUBLIC ASSET SHA-256 VERIFIED:', h)
          PY
