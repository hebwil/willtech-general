name: homologacao-3.0

on:
  pull_request:
    branches: [main]
  push:
    branches: [qoder/shared-intelligence]
  workflow_dispatch:

permissions:
  contents: read

env:
  WILLTECH_NODE: node

jobs:
  nucleo:
    name: nucleo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python e SQLite (FTS5 informativo)
        shell: bash
        run: |
          python --version
          python -c "import sqlite3; c=sqlite3.connect(':memory:');
          try:
              c.execute('CREATE VIRTUAL TABLE t USING fts5(x)'); print('FTS5: disponivel')
          except Exception as e:
              print('FTS5: ausente -> fallback LIKE exercido nos testes')"

      - name: Suites portaveis do nucleo (unittest)
        shell: bash
        run: |
          set -e
          for t in test-room test-room-v3 test-handoff test-jit test-smoke-e2e \
                   test-compare test-repomap test-supervisor test-compat \
                   test-claude test-homolog test-gui-install test-gui; do
            echo "=== $t ==="
            python "tools/$t.py"
          done

      - name: Fallback REAL sem FTS5 (WILLTECH_ROOM_NO_FTS5=1)
        shell: bash
        env:
          WILLTECH_ROOM_NO_FTS5: "1"
        run: |
          set -e
          python tools/test-jit.py
          python tools/test-room-v3.py

      - name: Protocolo REAL do codex-app-server (binario oficial)
        shell: bash
        run: |
          set -e
          case "${{ runner.os }}" in
            macOS) A=codex-app-server-aarch64-apple-darwin.tar.gz ;;
            Linux) A=codex-app-server-x86_64-unknown-linux-musl.tar.gz ;;
            Windows) A=codex-app-server-x86_64-pc-windows-msvc.exe.zip ;;
          esac
          mkdir -p "$RUNNER_TEMP/codex"
          curl -fsSL -o "$RUNNER_TEMP/codex/$A" "https://github.com/openai/codex/releases/latest/download/$A"
          cd "$RUNNER_TEMP/codex"
          case "$A" in
            *.zip) unzip -o "$A" ;;
            *) tar xzf "$A" ;;
          esac
          BIN=$(find "$RUNNER_TEMP/codex" -maxdepth 2 -type f -name 'codex-app-server*' ! -name '*.tar.gz' ! -name '*.zip' ! -name '*.sigstore' | head -1)
          chmod +x "$BIN" || true
          echo "WILLTECH_CODEX_BIN=$BIN" >> "$GITHUB_ENV"
          echo "binario oficial: $BIN"

      - name: Teste oficial do App Server + viewer Codex (node real)
        shell: bash
        run: |
          set -e
          python codex/willtech-visual/tools/test-appserver.py
          python codex/willtech-visual/tools/test-codex.py

      - name: Suites shell + instalador (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          export NODE_BIN=node
          bash tools/test-auto.sh
          bash tools/test-plan.sh
          bash tools/test-dossie.sh
          bash tools/test-drift.sh
          bash tools/test-trace.sh
          bash opencode/tests/test-wrappers.sh
          python tools/test-install.py

      - name: Ciclo do instalador PS1 (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $lab = Join-Path $env:RUNNER_TEMP ('wt lab ' + [char]0x00E7 + [char]0x00E3 + 'o')
          New-Item -ItemType Directory -Force -Path (Join-Path $lab 'tools') | Out-Null
          Copy-Item 'tools\willtech-auto.py' (Join-Path $lab 'tools\willtech-auto.py')
          New-Item -ItemType Directory -Force -Path (Join-Path $lab '.claude') | Out-Null
          $pre = '{"hooks":{"PreToolUse":[{"matcher":"Bash","hooks":[{"type":"command","command":"echo usuario"}]}]},"meu":"dado"}'
          Set-Content -Encoding utf8 (Join-Path $lab '.claude\settings.json') $pre
          $original = $pre | ConvertFrom-Json | ConvertTo-Json -Depth 20 -Compress
          function Assert([bool]$c, [string]$m) { if (-not $c) { throw "FALHOU: $m" }; Write-Host "ok $m" }
          function Run-Installer([string[]]$a) { & powershell -ExecutionPolicy Bypass -File 'tools\willtech-install.ps1' @a; Assert ($LASTEXITCODE -eq 0) "exit 0: $a" }
          Run-Installer @('-Repo', $lab, '-Yes')
          Assert (Test-Path (Join-Path $lab '.willtech\enabled')) 'enabled criado'
          Assert (Test-Path (Join-Path $lab '.codex\hooks.json')) 'hooks codex criados'
          Assert (Test-Path (Join-Path $lab '.opencode\plugins\willtech\index.js')) 'plugin opencode copiado'
          $raw = Get-Content (Join-Path $lab '.claude\settings.json') -Raw
          Assert ($raw -match 'echo usuario') 'hook do usuario preservado'
          Assert (($raw | ConvertFrom-Json).meu -eq 'dado') 'config do usuario preservada'
          Run-Installer @('-Repo', $lab, '-Yes')
          Run-Installer @('-Repo', $lab, '-Disable')
          Assert (-not (Test-Path (Join-Path $lab '.willtech\enabled'))) 'disable remove enabled'
          Run-Installer @('-Repo', $lab, '-Enable')
          Assert (Test-Path (Join-Path $lab '.willtech\enabled')) 'enable recria enabled'
          Run-Installer @('-Repo', $lab, '-Uninstall', '-Yes')
          $rest = Get-Content (Join-Path $lab '.claude\settings.json') -Raw | ConvertFrom-Json
          Assert (($rest | ConvertTo-Json -Depth 20 -Compress) -eq $original) 'config original restaurada'
          Assert (-not (Test-Path (Join-Path $lab '.codex\hooks.json'))) 'uninstall remove codex'
          Write-Host 'CICLO PS1 COMPLETO: PASS'

  opencode-host:
    name: opencode host oficial (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar OpenCode oficial (runner isolado)
        run: |
          set -e
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Projeto lab + instalacao WillTech + 7 agentes
        run: |
          set -e
          LAB="$RUNNER_TEMP/oc-repo"
          mkdir -p "$LAB"
          cp -R tools opencode "$LAB/"
          sh "$LAB/tools/willtech-install.sh" --repo "$LAB" --platform opencode --yes
          mkdir -p "$LAB/.opencode/agent"
          cp "$LAB/opencode/agent/"*.md "$LAB/.opencode/agent/"
          python3 tools/willtech-gui.py --install --yes --config "$LAB/opencode.json"
          echo "OC_LAB=$LAB" >> "$GITHUB_ENV"
      - name: Host oficial carrega plugin V2 + 7 agentes + hierarquia
        run: |
          set -e
          cd "$OC_LAB"
          opencode serve --hostname 127.0.0.1 --port 47823 --print-logs > "$RUNNER_TEMP/oc.log" 2>&1 &
          SRV=$!
          for i in $(seq 1 30); do grep -q "server password" "$RUNNER_TEMP/oc.log" && break; sleep 1; done
          export OPENCODE_PASSWORD=$(grep "server password" "$RUNNER_TEMP/oc.log" | awk '{print $NF}')
          opencode --server http://127.0.0.1:47823 api agent.list > "$RUNNER_TEMP/agents.json"
          python3 - "$RUNNER_TEMP/agents.json" "$OC_LAB" <<'PY'
          import json, sys, os
          data = json.load(open(sys.argv[1]))["data"]
          wt = [a for a in data if a["id"].startswith("willtech")]
          assert len(wt) == 7, f"esperava 7 agentes WillTech, obtive {len(wt)}: {[a['id'] for a in wt]}"
          assert all(a["mode"] == "subagent" for a in wt), "hierarquia: especialistas devem ser subagent"
          assert os.path.isfile(os.path.join(sys.argv[2], ".willtech", "state-plugin-load.json")), "plugin V2 setup nao executou no host oficial"
          print("OK host oficial: 7 agentes WillTech carregados, hierarquia subagent, plugin V2 setup executou")
          PY
          kill $SRV 2>/dev/null || true

  intelligence-smoke:
    name: smoke inteligencia 3.0 (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke integrado da inteligencia (14 criterios, subprocess real)
        run: python tools/smoke-intelligence.py