name: publish verified v3.1.1

# Publicacao de estabilizacao: nunca republica v3.0.0 nem v3.1.0, nunca ignora CI.
# DISPARO MANUAL somente apos aprovacao completa do CI 5/5 e revisao independente.
# Nenhum merge na main publica automaticamente.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: willtech-release-v3.1.1
  cancel-in-progress: false

jobs:
  homologacao:
    name: Gate real 5/5, no SHA desta release
    uses: ./.github/workflows/homologacao-3.0.yml
    permissions:
      contents: read

  publicar:
    name: pacote versionado, prova instalada, draft e release publica
    needs: [homologacao]
    if: github.ref == 'refs/heads/main' && github.repository == 'hebwil/willtech-general'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v3.1.1
      BENCHMARK_SOURCE_SHA: 31747cd4666596c0056d238cf992de4a02a52dde
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bloquear versao errada, runtime sem benchmark ou release existente
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(cat VERSION)" = "3.1.1"
          test -f docs/RELEASE-NOTES-3.1.1.md
          # A bancada mediu o runtime desta base. Toda alteracao de
          # runtime desde aquele SHA exige NOVO benchmark, nao herda os percentuais.
          git cat-file -e "$BENCHMARK_SOURCE_SHA^{commit}"
          git diff --exit-code "$BENCHMARK_SOURCE_SHA" HEAD -- \
            tools/willtech-auto.py tools/willtech-room.py \
            tools/willtech-repomap.py tools/willtech-bench-abc.py \
            tools/willtech-output.py opencode/plugins/willtech/index.js \
            opencode/agent claude-code codex
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "BLOQUEADO: release ja existe; sem sobreescrever artefatos." >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "BLOQUEADO: tag ja existe; sem mover tags." >&2
            exit 1
          fi
          echo "PASS: SHA exato e runtime medido; nenhuma tag/release anterior foi alterada."

      - name: Testar arquivos distribuiveis e regressao de release
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test-dist.py
          python3 tools/test-bench-abc.py
          python3 tools/test-adaptive-intelligence.py
          python3 tools/willtech-drift.py .
          python3 tools/build-dist.py HEAD
          python3 tools/verify-release.py dist "$RELEASE_TAG"
          test -s dist/MANIFEST.json
          test -s dist/SHA256SUMS.txt
          test -s "dist/willtech-general-3.1.1.tar.gz"

      - name: Criar release DRAFT com tag imutavel e os tres ativos
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "WillTech-General v3.1.1 — estabilizacao e teste rapido OpenCode" \
            --notes-file docs/RELEASE-NOTES-3.1.1.md \
            dist/MANIFEST.json dist/SHA256SUMS.txt \
            dist/willtech-general-3.1.1.tar.gz
          TARGET_SHA=$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)
          test "$TARGET_SHA" = "$GITHUB_SHA"
          echo "PASS: draft/tag fixados no commit validado $GITHUB_SHA"

      - name: Verificar ativos baixados do DRAFT antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/download"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/download"
          cmp dist/MANIFEST.json "$RUNNER_TEMP/download/MANIFEST.json"
          cmp dist/SHA256SUMS.txt "$RUNNER_TEMP/download/SHA256SUMS.txt"
          cmp dist/willtech-general-3.1.1.tar.gz \
              "$RUNNER_TEMP/download/willtech-general-3.1.1.tar.gz"
          python3 tools/verify-release.py "$RUNNER_TEMP/download" "$RELEASE_TAG"

      - name: Publicar SOMENTE apos gates e prova de distribuicao
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$GITHUB_SHA"
          echo "PUBLICADA: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"

      - name: Rebaixar ativos publicos e verificar integridade
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/public"
          cmp dist/MANIFEST.json "$RUNNER_TEMP/public/MANIFEST.json"
          cmp dist/SHA256SUMS.txt "$RUNNER_TEMP/public/SHA256SUMS.txt"
          cmp dist/willtech-general-3.1.1.tar.gz \
              "$RUNNER_TEMP/public/willtech-general-3.1.1.tar.gz"
          python3 tools/verify-release.py "$RUNNER_TEMP/public" "$RELEASE_TAG"
          echo "PASS: release publica identica ao SHA homologado."

      - name: Disparar verificacao independente da release publicada
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-verify.yml --ref main --field tag="$RELEASE_TAG"
          echo "Aguardando workflow release-verify; nao declarar PASS dele antes do resultado."
