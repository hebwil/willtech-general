name: inteligencia-gratuita

# WILLTECH-GENERAL 3.0 — Benchmark Real A/B/C + Sessão Coletiva (Custo US$ 0,00).
# Reusa o laboratório de modelo aberto gratuito comprovado (llama.cpp CPU +
# Qwen3-1.7B GGUF em 127.0.0.1, enable_thinking=false) e o host oficial OpenCode V2
# com provider openai-compatible APENAS no laboratório descartável.
#
# Compara sob condições idênticas (3 repetições por cenário × 3 cenários × 3 braços = 27 execuções):
# - Braço A: General 3.0 atual (WILLTECH_ADAPTIVE_JIT=0, WILLTECH_SPECIALIZED_MEMORY=0)
# - Braço B: General com JIT adaptativo (WILLTECH_ADAPTIVE_JIT=1, WILLTECH_SPECIALIZED_MEMORY=0)
# - Braço C: General com JIT adaptativo + RepoMap direcionado + memória especializada
#            (WILLTECH_ADAPTIVE_JIT=1, WILLTECH_SPECIALIZED_MEMORY=1)
#
# Segurança: runner público gratuito; permissions contents:read; nenhum segredo
# pessoal; apiKey do provider é placeholder local ("lab-no-auth").
# Não toca main, tags, release v3.0.0 nem instalações pessoais.

on:
  push:
    branches:
      - codex/3.0-inteligencia-economia
      - qoder/homologacao-zero-custo
      - fix/**
    paths:
      - ".github/workflows/inteligencia-gratuita.yml"
      - "tools/opencode-trace.py"
      - "tools/willtech-compare.py"
      - "tools/willtech-bench-abc.py"
      - "tools/willtech-repomap.py"
      - "tools/willtech-output.py"
      - "claude-code/bin/willtech_trace.py"
      - "tools/willtech-auto.py"
      - "tools/willtech-room.py"
      - "opencode/plugins/willtech/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  LLAMA_BUILD: b12483
  GGUF_REPO: ggml-org/Qwen3-1.7B-GGUF
  GGUF_FILE: Qwen3-1.7B-Q4_K_M.gguf
  MODEL_ID: qwen3-1.7b
  PROVIDER_ID: llamacpp

jobs:
  benchmark-abc:
    name: benchmark A/B/C (${{ matrix.scenario }}, ×3, gratuito)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        scenario: [T1, T2, T3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache do binário llama.cpp e do GGUF (gratuito)
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/lab-cache
          key: llama-${{ env.LLAMA_BUILD }}-${{ env.GGUF_FILE }}-v1

      - name: Baixar llama.cpp + GGUF Qwen3 (públicos)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/lab-cache
          curl --retry 3 --retry-delay 3 -fsSL -o ~/lab-cache/llama.tar.gz \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"
          curl --retry 3 --retry-delay 3 -fsSL -o ~/lab-cache/model.gguf \
            "https://huggingface.co/${GGUF_REPO}/resolve/main/${GGUF_FILE}?download=true"
          (cd ~/lab-cache && sha256sum llama.tar.gz model.gguf > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Extrair llama.cpp e localizar llama-server
        run: |
          set -e
          mkdir -p ~/llama
          tar xzf ~/lab-cache/llama.tar.gz -C ~/llama
          BIN=$(find ~/llama -maxdepth 3 -type f -name 'llama-server' | head -1)
          test -n "$BIN"
          chmod +x "$BIN"
          echo "LLAMA_BIN=$BIN" >> "$GITHUB_ENV"
          echo "LLAMA_DIR=$(dirname "$BIN")" >> "$GITHUB_ENV"
          sudo apt-get update -qq && sudo apt-get install -y -qq libgomp1 libopenblas0 || true

      - name: Iniciar servidor de inferência (CPU, 127.0.0.1, thinking off)
        run: |
          set -e
          export LD_LIBRARY_PATH="$LLAMA_DIR:${LD_LIBRARY_PATH:-}"
          nohup "$LLAMA_BIN" -m ~/lab-cache/model.gguf \
            --host 127.0.0.1 --port 8080 --jinja -c 8192 --threads 4 -np 1 \
            --chat-template-kwargs '{"enable_thinking":false}' \
            > ~/server.log 2>&1 &
          echo $! > ~/server.pid
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && { echo "servidor pronto"; break; }
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health

      - name: Instalar OpenCode oficial (gratuito, runner isolado)
        run: |
          set -e
          curl --retry 3 --retry-delay 3 -fsSL https://opencode.ai/v2/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version | tee ~/opencode-version.txt

      - name: Executar Benchmark Real A/B/C — cenário ${{ matrix.scenario }} (3 repetições por braço)
        run: |
          set -e
          export PATH="$HOME/.opencode/bin:$PATH"
          mkdir -p ~/bench-out
          python3 tools/willtech-bench-abc.py run-scenario \
            --scenario "${{ matrix.scenario }}" \
            --repeat 3 \
            --out-dir ~/bench-out \
            --lab-base "$RUNNER_TEMP/abc-lab" \
            --provider "${PROVIDER_ID}" \
            --model "${MODEL_ID}" \
            --timeout 240
          echo "=== JSON do cenário ${{ matrix.scenario }} ==="
          cat ~/bench-out/${{ matrix.scenario }}-compare.json

      - name: Publicar artefato do cenário ${{ matrix.scenario }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.scenario }}
          path: |
            ~/bench-out/*
            ~/server.log
            ~/opencode-version.txt
            ~/lab-cache/SHA256SUMS.txt

  sessao-coletiva:
    name: sessão coletiva autêntica (ubuntu, modelo gratuito)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache do binário llama.cpp e do GGUF (gratuito)
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/lab-cache
          key: llama-${{ env.LLAMA_BUILD }}-${{ env.GGUF_FILE }}-v1

      - name: Baixar llama.cpp + GGUF Qwen3 (públicos)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/lab-cache
          curl --retry 3 --retry-delay 3 -fsSL -o ~/lab-cache/llama.tar.gz \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"
          curl --retry 3 --retry-delay 3 -fsSL -o ~/lab-cache/model.gguf \
            "https://huggingface.co/${GGUF_REPO}/resolve/main/${GGUF_FILE}?download=true"

      - name: Extrair llama.cpp e iniciar servidor local
        run: |
          set -e
          mkdir -p ~/llama
          tar xzf ~/lab-cache/llama.tar.gz -C ~/llama
          BIN=$(find ~/llama -maxdepth 3 -type f -name 'llama-server' | head -1)
          test -n "$BIN"
          chmod +x "$BIN"
          sudo apt-get update -qq && sudo apt-get install -y -qq libgomp1 libopenblas0 || true
          export LD_LIBRARY_PATH="$(dirname "$BIN"):${LD_LIBRARY_PATH:-}"
          nohup "$BIN" -m ~/lab-cache/model.gguf \
            --host 127.0.0.1 --port 8080 --jinja -c 8192 --threads 4 -np 1 \
            --chat-template-kwargs '{"enable_thinking":false}' \
            > ~/server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && { echo "servidor pronto"; break; }
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health

      - name: Instalar OpenCode oficial + preparar laboratório coletivo
        run: |
          set -e
          curl --retry 3 --retry-delay 3 -fsSL https://opencode.ai/v2/install | bash
          export PATH="$HOME/.opencode/bin:$PATH"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          LAB="$RUNNER_TEMP/wt-lab-coletiva"
          mkdir -p "$LAB/claude-code/bin" "$LAB/src"
          cp -R tools opencode "$LAB/"
          cp claude-code/bin/willtech_trace.py "$LAB/claude-code/bin/"
          git -C "$LAB" init -q
          git -C "$LAB" config user.email lab@willtech
          git -C "$LAB" config user.name lab
          sh "$LAB/tools/willtech-install.sh" --repo "$LAB" --platform opencode --yes
          mkdir -p "$LAB/.opencode/agent"
          cp "$LAB/opencode/agent/"*.md "$LAB/.opencode/agent/"
          printf 'def soma(a, b):\n    return a + b\n' > "$LAB/src/app.py"
          printf 'def dobro(x):\n    return 2 * x\n' > "$LAB/src/util.py"
          cat > "$LAB/opencode.json" <<JSON
          {
            "\$schema": "https://opencode.ai/config.json",
            "providers": {
              "${PROVIDER_ID}": {
                "package": "@opencode/ai/providers/openai-compatible",
                "settings": { "baseURL": "http://127.0.0.1:8080/v1", "apiKey": "lab-no-auth" },
                "models": { "${MODEL_ID}": { "capabilities": { "tools": true },
                  "limit": { "context": 8192, "output": 2048 },
                  "cost": { "input": 0, "output": 0 } } }
              }
            },
            "plugins": ["./.opencode/plugins/willtech"]
          }
          JSON
          mkdir -p "$LAB/.willtech"
          touch "$LAB/.willtech/enabled"
          ROOM="$LAB/.willtech/room.db"
          python3 "$LAB/tools/willtech-room.py" init "$ROOM" --repo "$LAB"
          H0=$(sha256sum "$LAB/src/app.py" | cut -d' ' -f1)
          FID=$(python3 "$LAB/tools/willtech-room.py" put "$ROOM" --kind finding --specialty explorer \
            --summary "soma(a,b) em src/app.py retorna a+b" --path-ref src/app.py \
            --evidence-hash "$H0" --repo "$LAB" | grep -o 'id=[0-9]*' | cut -d= -f2)
          python3 "$LAB/tools/willtech-room.py" validate "$ROOM" --id "$FID" --by reviewer --repo "$LAB"
          git -C "$LAB" add -A
          git -C "$LAB" commit -qm base
          python3 "$LAB/tools/willtech-repomap.py" update "$LAB" "$LAB/.willtech/repomap.json"
          echo "WT_LAB=$LAB" >> "$GITHUB_ENV"
          echo "OPENCODE_CONFIG=$LAB/opencode.json" >> "$GITHUB_ENV"

      - name: Sessão coletiva AUTÊNTICA com JIT Adaptativo + Memória Especializada
        env:
          WILLTECH_ADAPTIVE_JIT: "1"
          WILLTECH_SPECIALIZED_MEMORY: "1"
        run: |
          set -e
          export PATH="$HOME/.opencode/bin:$PATH"
          cd "$WT_LAB"
          TASK3="Tarefa multi-etapa em varios arquivos: (1) investigue src/app.py e src/util.py; (2) registre na sala compartilhada o que a funcao dobro faz; (3) delegue ao testador a verificacao; (4) consolide o resultado. Siga AGENTS.md e use os agentes WillTech."
          timeout 480 opencode run --standalone --model "${PROVIDER_ID}/${MODEL_ID}" \
            --format json --auto "$TASK3" > ~/oc-coletiva.jsonl 2> ~/oc-coletiva.err || echo "coletiva exit=$?"
          ls -la .willtech/ | tee ~/lab-state.txt
          cat .willtech/jit-metrics.jsonl > ~/coletiva-jit-metrics.jsonl 2>/dev/null || true
          python3 tools/willtech-room.py export .willtech/room.db --repo "$WT_LAB" > ~/room-after.json 2>&1 || true
          python3 "$GITHUB_WORKSPACE/tools/opencode-trace.py" ~/oc-coletiva.jsonl ~/conv-coletiva.jsonl \
            --model "${PROVIDER_ID}/${MODEL_ID}" --cwd "$WT_LAB"
          python3 "$GITHUB_WORKSPACE/claude-code/bin/willtech_trace.py" ~/conv-coletiva.jsonl | tee ~/coletiva-trace.txt
          python3 - <<'PY'
          import json, os
          evs = [json.loads(l) for l in open(os.path.expanduser("~/oc-coletiva.jsonl")) if l.strip()]
          sid = next((e.get("sessionID") for e in evs if e.get("sessionID")), None)
          tools = [e["part"].get("tool") for e in evs if e.get("type") == "tool_use"]
          deleg = [e["part"].get("state", {}).get("input", {}) for e in evs
                   if e.get("type") == "tool_use" and e["part"].get("tool") in ("task", "subagent", "agent")]
          room_calls = [e["part"].get("state", {}).get("input", {}).get("command", "") for e in evs
                        if e.get("type") == "tool_use" and "willtech-room" in str(e["part"].get("state", {}).get("input", {}))]
          coletiva_meta = {
              "sessionID": sid,
              "tools_used": tools,
              "delegations_count": len(deleg),
              "room_calls_count": len(room_calls),
              "cost_real_usd": 0.0,
              "simulation": False,
          }
          open(os.path.expanduser("~/coletiva-summary.json"), "w").write(json.dumps(coletiva_meta, indent=2, ensure_ascii=False))
          print(json.dumps(coletiva_meta, indent=2, ensure_ascii=False))
          assert sid, "sessão coletiva sem sessionID — não aconteceu"
          PY

      - name: Publicar artefato da sessão coletiva
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homolog-coletiva
          path: |
            ~/oc-coletiva.jsonl
            ~/oc-coletiva.err
            ~/conv-coletiva.jsonl
            ~/coletiva-trace.txt
            ~/coletiva-summary.json
            ~/coletiva-jit-metrics.jsonl
            ~/room-after.json
            ~/lab-state.txt

  consolidar-abc:
    name: consolidar benchmark A/B/C (27 execuções reais)
    runs-on: ubuntu-latest
    needs: [benchmark-abc, sessao-coletiva]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar artefatos dos cenários T1, T2, T3 e sessão coletiva
        uses: actions/download-artifact@v4
        with:
          path: ~/downloaded-artifacts

      - name: Consolidar resultados reais A/B/C (sem números inventados)
        run: |
          set -e
          mkdir -p ~/all-compare ~/consolidated
          find ~/downloaded-artifacts -name '*-compare.json' -exec cp {} ~/all-compare/ \;
          ls -la ~/all-compare/
          python3 tools/willtech-bench-abc.py consolidate \
            --in-dir ~/all-compare \
            --out-json ~/consolidated/abc-consolidated.json \
            --out-md ~/consolidated/abc-report.md
          cat ~/consolidated/abc-report.md >> "$GITHUB_STEP_SUMMARY"
          cp ~/downloaded-artifacts/homolog-coletiva/coletiva-summary.json ~/consolidated/ 2>/dev/null || true

      - name: Publicar relatório consolidado A/B/C
        uses: actions/upload-artifact@v4
        with:
          name: homolog-abc-consolidado
          path: |
            ~/consolidated/*
            ~/all-compare/*
